<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>YouTube Playlist Broadcast</title>

  <style>
    :root {
      --background: #08000e;
      --panel: rgba(18, 4, 29, 0.9);
      --purple: #b84dff;
      --purple-dark: #5b167c;
      --green: #b9ff39;
      --white: #f8efff;
      --muted: #bca9c8;
      --border: rgba(184, 77, 255, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;

      color: var(--white);
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(104, 27, 150, 0.34),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #050008,
          var(--background) 48%,
          #12001c
        );

      font-family:
        "Courier New",
        Courier,
        monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        );

      background-size: 38px 38px;
      mask-image:
        radial-gradient(
          circle at center,
          black,
          transparent 82%
        );
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;

      opacity: 0.2;
      mix-blend-mode: screen;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(255, 255, 255, 0.07) 3px,
          transparent 4px
        );
    }

    .broadcast {
      width: min(1100px, 100%);
      animation: appear 900ms ease-out both;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .title-group {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 7px;

      color: var(--green);
      font-size: clamp(0.7rem, 2vw, 0.88rem);
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      text-shadow:
        0 0 8px rgba(185, 255, 57, 0.8);
    }

    h1 {
      margin: 0;

      font-size: clamp(1.65rem, 5vw, 3.5rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
      text-transform: uppercase;

      text-shadow:
        3px 0 rgba(185, 255, 57, 0.42),
        -3px 0 rgba(184, 77, 255, 0.7),
        0 0 26px rgba(184, 77, 255, 0.42);
    }

    .status {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 9px;
      padding-bottom: 4px;

      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;

      background: var(--green);
      box-shadow:
        0 0 5px var(--green),
        0 0 15px var(--green);

      animation: blink 1.8s steps(2, end) infinite;
    }

    .terminal-bar {
      display: flex;
      justify-content: space-between;
      gap: 16px;

      padding: 10px 14px;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;

      color: var(--muted);
      background: rgba(11, 1, 17, 0.88);

      font-size: clamp(0.62rem, 1.8vw, 0.78rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;

      box-shadow:
        0 0 20px rgba(184, 77, 255, 0.15);
    }

    .terminal-bar strong {
      color: var(--green);
    }

    .screen-shell {
      position: relative;
      isolation: isolate;

      padding: clamp(8px, 1.5vw, 15px);
      border: 1px solid var(--border);
      border-radius: 0 0 18px 18px;

      background:
        linear-gradient(
          145deg,
          rgba(45, 10, 65, 0.9),
          rgba(10, 1, 17, 0.96)
        );

      box-shadow:
        0 0 0 1px rgba(185, 255, 57, 0.08),
        0 0 40px rgba(184, 77, 255, 0.25),
        0 24px 70px rgba(0, 0, 0, 0.65);
    }

    .screen-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      border-radius: inherit;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(185, 255, 57, 0.14),
          transparent
        );

      transform: translateX(-100%);
      animation: sweep 7s linear infinite;
    }

    .screen {
      position: relative;
      overflow: hidden;

      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(185, 255, 57, 0.28);
      border-radius: 10px;

      background: #000;

      box-shadow:
        inset 0 0 35px rgba(184, 77, 255, 0.18),
        0 0 20px rgba(185, 255, 57, 0.08);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      border-radius: inherit;

      background:
        radial-gradient(
          ellipse at center,
          transparent 55%,
          rgba(0, 0, 0, 0.28) 100%
        );
    }

    .screen::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -20%;
      z-index: 3;
      height: 15%;
      pointer-events: none;

      opacity: 0.24;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(185, 255, 57, 0.35),
          transparent
        );

      animation: tracking 6s linear infinite;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 13px;

      color: var(--muted);
      font-size: clamp(0.62rem, 1.8vw, 0.75rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer span:last-child {
      color: var(--purple);
      text-align: right;
      text-shadow:
        0 0 8px rgba(184, 77, 255, 0.7);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        filter: blur(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes blink {
      0%,
      44% {
        opacity: 1;
      }

      45%,
      55% {
        opacity: 0.25;
      }

      56%,
      100% {
        opacity: 1;
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(-100%);
      }

      35%,
      100% {
        transform: translateX(100%);
      }
    }

    @keyframes tracking {
      from {
        transform: translateY(-100%);
      }

      to {
        transform: translateY(800%);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .terminal-bar span:last-child {
        display: none;
      }

      .footer {
        flex-direction: column;
        gap: 7px;
      }

      .footer span:last-child {
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="broadcast">
    <header class="header">
      <div class="title-group">
        <p class="eyebrow">
          Honestly Thomas Archive Transmission
        </p>

        <h1>
          Playlist Broadcast
        </h1>
      </div>

      <div class="status" aria-label="Broadcast online">
        <span class="status-light" aria-hidden="true"></span>
        signal online
      </div>
    </header>

    <div class="terminal-bar">
      <span>
        <strong>&gt;</strong>
        loading archived media sequence
      </span>

      <span>
        channel_001 // youtube
      </span>
    </div>

    <section class="screen-shell">
      <div class="screen">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLatnmy7XVC5kebBRuAPLE6zcrRw9ACUIj"
          title="YouTube playlist player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <footer class="footer">
      <span>
        Select a video from the playlist controls
      </span>

      <span>
        The internet is dead // the archive remains
      </span>
    </footer>
  </main>
</body>
</html>
